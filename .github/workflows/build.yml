# Tests and builds the app on both platforms: PyInstaller cannot cross-compile, so the
# macOS bundle is built on a macOS runner and the Windows executable on a Windows runner.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact: TeamsPresence-macos
          - os: windows-latest
            artifact: TeamsPresence-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev,app]"
      - name: Test
        run: |
          pytest
          ruff check .
          mypy
      - name: Build
        run: pyinstaller --noconfirm packaging/TeamsPresence.spec
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/TeamsPresence.app dist/${{ matrix.artifact }}.zip
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/TeamsPresence.exe -DestinationPath dist/${{ matrix.artifact }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.zip
